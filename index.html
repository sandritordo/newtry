<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>odd.cut media</title>

<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d0d0d;
  --card:#1a1a1a;
  --text:#fff;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"League Spartan",sans-serif;
}

/* NAV */
.nav{
  position:fixed;
  width:100%;
  padding:20px 0;
  z-index:10;
}
.nav-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo img{
  height:28px;
}
.nav-links{
  display:flex;
  gap:24px;
  font-size:12px;
  letter-spacing:.2em;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:flex-end;
  padding:60px;
  position:relative;
}

h1{
  font-size:72px;
  font-weight:800;
}

/* SYMBOL BACKGROUND */
.symbol-bg{
  position:absolute;
  inset:0;
  background:url('/symbol.png') center/600px no-repeat;
  opacity:.08;
  filter:blur(40px);
}

/* WORK GRID */
.work-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  padding:100px 60px;
}

.project{
  position:relative;
  background:#111;
  aspect-ratio:16/9;
  overflow:hidden;
  cursor:pointer;
}

.project img{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.7;
  transition:.4s;
}

.project:hover img{
  opacity:1;
  transform:scale(1.05);
}

/* PLAY BUTTON */
.play{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:.3s;
}

.project:hover .play{
  opacity:1;
}

.play::after{
  content:'';
  width:60px;
  height:60px;
  border-radius:50%;
  background:radial-gradient(circle at center, #ff6a00, #ff0066, #3cf);
  opacity:.9;
}

/* TITLE */
.caption{
  position:absolute;
  bottom:0;
  padding:16px;
  font-size:16px;
}

/* TEAM */
.team{
  padding:100px 60px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.portrait{
  aspect-ratio:4/5;
  overflow:hidden;
}

.portrait img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SMALL TITLES */
h2{
  font-size:42px;
}
</style>
</head>

<body>

<header class="nav">
  <div class="nav-inner">
    <div class="logo">
      <img src="/logo.png">
    </div>
    <div class="nav-links">
      <a>work</a>
      <a>about</a>
      <a>contact</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="symbol-bg"></div>
  <h1>Video that communicates.</h1>
</section>

<section class="work-grid">

  <!-- PROJECTS -->
  <div class="project">
    <img src="https://picsum.photos/800/400?1">
    <div class="play"></div>
    <div class="caption">Project 01</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?2">
    <div class="play"></div>
    <div class="caption">Project 02</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?3">
    <div class="play"></div>
    <div class="caption">Project 03</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?4">
    <div class="play"></div>
    <div class="caption">Project 04</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?5">
    <div class="play"></div>
    <div class="caption">Project 05</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?6">
    <div class="play"></div>
    <div class="caption">Project 06</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?7">
    <div class="play"></div>
    <div class="caption">Project 07</div>
  </div>

  <div class="project">
    <img src="https://picsum.photos/800/400?8">
    <div class="play"></div>
    <div class="caption">Project 08</div>
  </div>

</section>

<section class="team">
  <div>
    <div class="portrait">
      <img src="/sandro.jpg">
    </div>
    <h2>Sandro Tordo</h2>
    <p>Founder · Video Creation</p>
  </div>

  <div>
    <div class="portrait">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330">
    </div>
    <h2>Maria João</h2>
    <p>Founder · Post Production</p>
  </div>
</section>

</body>
</html>
